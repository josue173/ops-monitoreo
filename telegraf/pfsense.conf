# Bloque para el paquete Telegraf de pfSense (System › Package Manager › telegraf).
# En Services › Telegraf, pega este contenido en el campo de configuración adicional.
# Reemplaza TOKEN_DE_INFLUX por el valor de INFLUX_TOKEN del archivo .env de srv-ops.
# Revisa los nombres de interfaz en Interfaces › Assignments (pueden no ser vtnet*).

[[outputs.influxdb_v2]]
  urls = ["http://10.10.30.20:8086"]
  token = "TOKEN_DE_INFLUX"
  organization = "prepago"
  bucket = "monitoreo"

# Latencia y pérdida desde el gateway, por IPv4 e IPv6
[[inputs.ping]]
  urls = ["1.1.1.1", "8.8.8.8", "2606:4700:4700::1111", "2001:4860:4860::8888"]
  method = "native"
  count = 3
  ping_interval = 1.0
  timeout = 2.0

# Disponibilidad del portal: la VIP de HAProxy y cada réplica, por IPv4 e IPv6
[[inputs.http_response]]
  urls = [
    "http://10.10.30.10/api/salud",
    "http://10.10.30.11:8081/api/salud",
    "http://10.10.30.11:8082/api/salud",
    "http://[2001:db8:acad:30::11]:8081/api/salud",
  ]
  method = "GET"
  response_timeout = "3s"
  follow_redirects = false

# Ancho de banda por interfaz: WAN y cada VLAN
[[inputs.net]]
  interfaces = ["vtnet0", "vtnet1", "vtnet1.20", "vtnet1.30"]
  ignore_protocol_stats = true
