# Telegraf del contenedor de srv-ops (o de tu laptop en pruebas).
# Las variables ${...} vienen de docker-compose.yml.

[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"
  hostname = "srv-ops"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "prepago"
  bucket = "monitoreo"

# Latencia y pérdida hacia Internet (IPv4). En pfSense se agregan destinos IPv6.
[[inputs.ping]]
  urls = ["1.1.1.1", "8.8.8.8"]
  method = "native"
  count = 3
  ping_interval = 1.0
  timeout = 2.0

# Disponibilidad (uptime) y tiempo de respuesta de cada réplica del portal
[[inputs.http_response]]
  urls = ["${PORTAL_A_URL}", "${PORTAL_B_URL}"]
  method = "GET"
  response_timeout = "3s"
  follow_redirects = false

# Ancho de banda por interfaz (bytes_recv / bytes_sent acumulados)
[[inputs.net]]
  interfaces = ["eth*", "ens*"]
  ignore_protocol_stats = true
